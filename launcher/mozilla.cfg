// Kopatel Online 2012 launcher, Firefox AutoConfig (the first line is skipped).
// Full screen that Esc does not end: Firefox leaves page full screen (requestFullscreen) on every Esc,
// and Esc is the game's menu key. The game page asks for the browser's own full screen (F11 mode)
// instead: "KopToggleFullscreen" toggles it, "KopFullscreenProbe" only tells the page we are here.
// The answer is the data-kop-launcher attribute on the page's <html>, set while the page's
// dispatchEvent runs (a preventDefault from here does not show in the page's dispatchEvent result).
try {
  Components.utils.import("resource://gre/modules/Services.jsm");
  var answer = function (event) {
    var doc = event.originalTarget.ownerDocument || event.originalTarget;
    if (doc.documentElement)
      doc.documentElement.setAttribute("data-kop-launcher", "1");
  };
  Services.obs.addObserver(function (win) {
    win.gBrowser.addEventListener("KopFullscreenProbe", answer, false, true);
    win.gBrowser.addEventListener("KopToggleFullscreen", function (event) {
      answer(event);
      win.fullScreen = !win.fullScreen;
    }, false, true);
  }, "browser-delayed-startup-finished", false);
} catch (e) {
  Components.utils.reportError(e);
}
