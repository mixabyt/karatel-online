// Kopatel Online 2014: makes the bundled Firefox 51 behave like a game window (this first line is skipped by Firefox).
// Loaded through defaults/pref/autoconfig.js with chrome privileges. The browser window goes to
// Firefox's own full screen (F11 mode, which Esc does not leave), and everything that makes it feel
// like a browser is switched off: shortcuts, menus, tabs, new windows, zoom, dragging, other pages.
// Links the game opens go to the system browser instead.
var Cc = Components.classes, Ci = Components.interfaces, Cu = Components.utils;
Cu.import("resource://gre/modules/Services.jsm");

var KOPATEL_GAME_URL = "";
try {
  KOPATEL_GAME_URL = Services.prefs.getCharPref("browser.startup.homepage");
} catch (e) {}

function kopatelOrigin(url) {
  var m = /^(https?:\/\/[^\/]+)/i.exec(url || "");
  return m ? m[1].toLowerCase() : "";
}

function kopatelIsGameUrl(url) {
  return !!url && (kopatelOrigin(url) === kopatelOrigin(KOPATEL_GAME_URL) || /^(about:blank|data:)/.test(url));
}

function kopatelOpenExternal(url) {
  try {
    if (!/^https?:\/\//i.test(url)) {
      return;
    }
    var uri = Services.io.newURI(url, null, null);
    Cc["@mozilla.org/uriloader/external-protocol-service;1"]
      .getService(Ci.nsIExternalProtocolService).loadURI(uri, null);
  } catch (e) {}
}

function kopatelErrorPage() {
  var url = KOPATEL_GAME_URL.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  return "data:text/html;charset=utf-8," + encodeURIComponent(
    "<!doctype html><meta charset=utf-8><title>\u041a\u043e\u043f\u0430\u0442\u0435\u043b\u044c \u041e\u043d\u043b\u0430\u0439\u043d 2014</title>" +
    "<body style='margin:0;height:100%;background:#3e4757;color:#e8edf2;font:18px Tahoma,Arial,sans-serif;" +
    "display:flex;align-items:center;justify-content:center;text-align:center' oncontextmenu='return false'>" +
    "<div><p>\u0421\u0435\u0440\u0432\u0435\u0440 \u0433\u0440\u0438 \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u0438\u0439:<br><b>" + url + "</b></p>" +
    "<p><a href=\"" + url + "\" style='display:inline-block;padding:10px 22px;background:#e08a2c;color:#fff;" +
    "text-decoration:none;border-radius:6px'>\u0421\u043f\u0440\u043e\u0431\u0443\u0432\u0430\u0442\u0438 \u0449\u0435 \u0440\u0430\u0437</a></p>" +
    "<p style='font-size:14px;opacity:.7'>\u0412\u0438\u0439\u0442\u0438: Alt+F4</p></div>");
}

// Keys a game window keeps: F11 is our full-screen toggle; everything else without Ctrl/Alt goes
// on to the page and the plugin (WASD, Esc, Enter, F12 for the game's own full-screen key...).
var KOPATEL_BLOCKED_KEYS = { 112: 1, 113: 1, 114: 1, 116: 1, 117: 1, 118: 1, 121: 1 }; // F1 F2 F3 F5 F6 F7 F10

function kopatelSetupWindow(win) {
  var doc = win.document;
  var root = doc.documentElement;
  if (root.getAttribute("windowtype") !== "navigator:browser" || win.kopatelReady) {
    return;
  }
  // Only one game window: any other browser window (Ctrl+N slipping through, window.open) closes.
  var others = Services.wm.getEnumerator("navigator:browser");
  while (others.hasMoreElements()) {
    var other = others.getNext();
    if (other !== win && other.kopatelReady) {
      win.close();
      return;
    }
  }
  win.kopatelReady = true;

  // Title is just the page's <title>, without " - Mozilla Firefox".
  root.setAttribute("titlemodifier", "");
  root.setAttribute("titlemenuseparator", "");
  root.setAttribute("titlepreface", "");
  try {
    win.gBrowser.updateTitlebar();
  } catch (e) {}

  // Every <key> of the browser (new tab, find, print, devtools on F12, zoom, history...) goes dead.
  var keys = doc.getElementsByTagName("key");
  for (var i = 0; i < keys.length; i++) {
    keys[i].setAttribute("disabled", "true");
    keys[i].removeAttribute("command");
    keys[i].removeAttribute("oncommand");
  }

  function toggleFullScreen() {
    win.fullScreen = !win.fullScreen;
    // The window resize takes keyboard focus away from the plugin; give it back to the game.
    win.setTimeout(function () {
      try {
        var player = win.gBrowser.contentDocument.getElementById("unityPlayer");
        if (player) {
          player.focus();
        }
      } catch (e) {}
    }, 400);
  }

  win.addEventListener("keydown", function (e) {
    // F11, and F12 when the keyboard is not in the game itself (the launcher turns F11 into F12
    // and the game handles F12 when it has the focus).
    if (e.keyCode === 122 || e.keyCode === 123) {
      e.preventDefault();
      e.stopPropagation();
      toggleFullScreen();
      return;
    }
    var target = e.target;
    var editable = target && (target.localName === "input" || target.localName === "textarea");
    if (e.ctrlKey || e.altKey || e.metaKey || KOPATEL_BLOCKED_KEYS[e.keyCode] ||
        (e.keyCode === 8 && !editable)) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
  win.addEventListener("keypress", function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
  // Bare Alt would bring up the menu bar.
  win.addEventListener("keyup", function (e) {
    if (e.keyCode === 18) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  ["contextmenu", "dragover", "drop", "dragstart"].forEach(function (type) {
    win.addEventListener(type, function (e) {
      e.preventDefault();
      e.stopPropagation();
    }, true);
  });
  win.addEventListener("DOMMouseScroll", function (e) {
    if (e.ctrlKey) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
  win.addEventListener("wheel", function (e) {
    if (e.ctrlKey) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  // Requests from the game page (index.html): wantsUntrusted, since they come from content.
  win.addEventListener("KopatelToggleFullScreen", function () {
    toggleFullScreen();
  }, true, true);
  win.addEventListener("KopatelOpenUrl", function (e) {
    kopatelOpenExternal(String(e.detail));
  }, true, true);

  // The same two requests as plain functions on the game page (kopatelToggleFullScreen(),
  // kopatelOpenUrl(url)), in case the events above do not make it from content to chrome.
  win.gBrowser.addEventListener("DOMWindowCreated", function (e) {
    var content = e.target.defaultView;
    if (!content || content.top !== content || !kopatelIsGameUrl(String(content.location))) {
      return;
    }
    try {
      Cu.exportFunction(function () {
        toggleFullScreen();
      }, content, { defineAs: "kopatelToggleFullScreen" });
      Cu.exportFunction(function (url) {
        kopatelOpenExternal(String(url));
      }, content, { defineAs: "kopatelOpenUrl" });
    } catch (ex) {
      Cu.reportError(ex);
    }
  }, true);

  // Tabs and new windows: whatever would open goes to the system browser.
  var gBrowser = win.gBrowser;
  gBrowser.addTab = function (uri) {
    if (typeof uri === "string") {
      kopatelOpenExternal(uri);
    }
    return gBrowser.selectedTab;
  };
  gBrowser.loadOneTab = gBrowser.addTab;
  gBrowser.removeTab = function () {};
  gBrowser.removeCurrentTab = function () {};

  // The game page is the only page: other sites open outside, failed loads show our error page.
  gBrowser.addProgressListener({
    QueryInterface: function (iid) {
      if (iid.equals(Ci.nsIWebProgressListener) || iid.equals(Ci.nsISupportsWeakReference) || iid.equals(Ci.nsISupports)) {
        return this;
      }
      throw Components.results.NS_ERROR_NO_INTERFACE;
    },
    onStateChange: function (webProgress, request, flags, status) {
      if (!webProgress.isTopLevel || !(flags & Ci.nsIWebProgressListener.STATE_IS_DOCUMENT)) {
        return;
      }
      var url = "";
      try {
        url = request.QueryInterface(Ci.nsIChannel).URI.spec;
      } catch (e) {}
      if ((flags & Ci.nsIWebProgressListener.STATE_START) && url && !kopatelIsGameUrl(url)) {
        request.cancel(Components.results.NS_BINDING_ABORTED);
        kopatelOpenExternal(url);
      } else if ((flags & Ci.nsIWebProgressListener.STATE_STOP) && status !== 0 &&
                 status !== Components.results.NS_BINDING_ABORTED && kopatelIsGameUrl(url) && !/^data:/.test(url)) {
        win.setTimeout(function () {
          gBrowser.loadURI(kopatelErrorPage());
        }, 0);
      }
    },
    onLocationChange: function () {},
    onProgressChange: function () {},
    onStatusChange: function () {},
    onSecurityChange: function () {}
  });

  win.fullScreen = true;
}

// Browser helper windows (library, downloads, page info, print preview...) have no place in a game.
var KOPATEL_CLOSE_WINDOWS = {
  "Places:Organizer": 1, "Download:Manager": 1, "Browser:page-info": 1, "Toolkit:PrintPreview": 1,
  "Browser:Preferences": 1, "Toolkit:AddonManager": 1, "devtools:toolbox": 1, "devtools:scratchpad": 1
};

Services.obs.addObserver({
  observe: function (subject) {
    kopatelSetupWindow(subject);
  }
}, "browser-delayed-startup-finished", false);

Services.ww.registerNotification({
  observe: function (subject, topic) {
    if (topic !== "domwindowopened") {
      return;
    }
    subject.addEventListener("load", function () {
      var type = subject.document.documentElement.getAttribute("windowtype");
      if (KOPATEL_CLOSE_WINDOWS[type]) {
        subject.close();
      }
    }, false);
  }
});
